name: Scribe Wolfi Release

on:
  workflow_dispatch:
    inputs:
      release_index:
        required: true
        description: "Release index number"

env:
  REGISTRY: scribesecurity
  IMAGE_NAME: superset
  PY_VERSION: "py311"
  PY_VER_ARG: "3.11-slim-bookworm"
  WOLFI_BRANCH: "wolfi"
  SCARF_ANALYTICS: "false"

jobs:
  build:
    name: Build Wolfi Image for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64] # Added ARM64 architecture
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Setup
        uses: ./.github/actions/docker-setup
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64 # Enable QEMU for ARM64 emulation

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Build Variables
        id: prep
        run: |
          # This step prepares all the build variables needed for architecture-specific builds
          # It handles the different naming conventions for AMD64 vs ARM64 images

          # Convert the platform (linux/amd64 or linux/arm64) to a short architecture tag (amd or arm)
          # This keeps image tags concise while still indicating the architecture
          ARCH_TAG="${{ matrix.platform == 'linux/amd64' && 'amd' || 'arm' }}"

          # Create the base tag that all image versions will be derived from
          # Format: registry/image:branch-releaseindex
          BASE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ inputs.release_index }}"

          # Create the architecture-specific Wolfi tag
          # Format: registry/image:branch-releaseindex-wolfi-arch
          WOLFI_TAG="${BASE_TAG}-wolfi-${ARCH_TAG}"

          # For branch builds (e.g., wolfi branch), create an additional branch-specific tag
          # This allows users to always pull the latest from a specific branch
          if [ "${{ github.ref_name }}" = "${{ env.WOLFI_BRANCH }}" ]; then
            TAGS="${WOLFI_TAG},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.WOLFI_BRANCH }}-wolfi-${ARCH_TAG}"
          else
            TAGS="${WOLFI_TAG}"
          fi

          # Determine the base image to use for this build
          # The base image is what the Wolfi Dockerfile uses as its starting point
          BASE_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ inputs.release_index }}-${{ env.PY_VERSION }}"

          # For ARM64 builds, we need to use the ARM64-specific base image
          # This is crucial for multi-architecture support
          if [ "${{ matrix.platform }}" = "linux/arm64" ]; then
            BASE_IMAGE="${BASE_IMAGE}-arm64"
          fi

          # Export all these variables for use in subsequent steps
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "base_image=$BASE_IMAGE" >> $GITHUB_OUTPUT
          echo "arch_tag=$ARCH_TAG" >> $GITHUB_OUTPUT
          echo "wolfi_tag=$WOLFI_TAG" >> $GITHUB_OUTPUT
          echo "platform=${{ matrix.platform }}" >> $GITHUB_OUTPUT

      - name: Prepare Wolfi files
        run: |
          mkdir -p docker/pythonpath
          cp wolfi/docker/pythonpath/* docker/pythonpath/ || true

      - name: Build base image first
        run: |
          echo "Building base image for ${{ steps.prep.outputs.platform }}..."
          # Define the base image tag
          BASE_IMAGE="${{ steps.prep.outputs.base_image }}"
          echo "Base image will be: $BASE_IMAGE"

          # Instead of using --env-file which isn't supported, export the environment variable directly
          export SCARF_ANALYTICS=false

          # Build the base image using docker-compose build
          docker buildx build \
            -t $BASE_IMAGE \
            --target dev \
            --platform ${{ steps.prep.outputs.platform }} \
            --build-arg PY_VER=${{ env.PY_VER_ARG }} \
            --build-arg SCARF_ANALYTICS=${{ env.SCARF_ANALYTICS }} \
            --push \
            .

          echo "✅ Successfully built and pushed base image: $BASE_IMAGE"

      - name: Build and push Wolfi image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: wolfi/Dockerfile.wolfi
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            BASE_IMAGE=${{ steps.prep.outputs.base_image }}
            SCARF_ANALYTICS=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create regular tag for Wolfi image
        run: |
          BASE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ inputs.release_index }}"
          WOLFI_TAG="${BASE_TAG}-wolfi"
          ARCH_TAG="${{ steps.prep.outputs.arch_tag }}"
          ARCH_SPECIFIC_TAG="${WOLFI_TAG}-${ARCH_TAG}"

          echo "Creating architecture-specific tag for Wolfi image..."

          # Pull with explicit platform flag to avoid architecture mismatch errors
          docker pull --platform ${{ matrix.platform }} $ARCH_SPECIFIC_TAG

          # Skip creating combined tags for each architecture - we'll do that in the manifest job
          if [ "${{ matrix.platform }}" = "linux/amd64" ]; then
            echo "Creating main tag for AMD64 image..."
            docker tag $ARCH_SPECIFIC_TAG $WOLFI_TAG
            docker push $WOLFI_TAG
            echo "✅ Successfully created and pushed: $WOLFI_TAG"
          fi

          # Create branch-specific architecture tag if applicable
          if [ "${{ github.ref_name }}" = "${{ env.WOLFI_BRANCH }}" ]; then
            BRANCH_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.WOLFI_BRANCH }}-wolfi"
            BRANCH_ARCH_TAG="${BRANCH_TAG}-${ARCH_TAG}"
            
            echo "Creating branch-specific architecture tag..."
            # Again, pull with explicit platform flag
            docker pull --platform ${{ matrix.platform }} $BRANCH_ARCH_TAG
            
            if [ "${{ matrix.platform }}" = "linux/amd64" ]; then
              echo "Creating branch tag for AMD64 image..."
              docker tag $BRANCH_ARCH_TAG $BRANCH_TAG
              docker push $BRANCH_TAG
              echo "✅ Successfully created and pushed branch tag: $BRANCH_TAG"
            fi
          fi

      - name: Generate summary
        run: |
          # This step creates a detailed summary of the built images for this architecture
          # The summary helps track what was built and provides useful commands for users

          # Setup tag variables
          BASE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ inputs.release_index }}"
          WOLFI_TAG="${BASE_TAG}-wolfi"
          ARCH_TAG="${{ steps.prep.outputs.arch_tag }}"
          ARCH_SPECIFIC_TAG="${WOLFI_TAG}-${ARCH_TAG}"

          # Start building the GitHub step summary with a header
          echo "## 🚀 Wolfi Image Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Details" >> $GITHUB_STEP_SUMMARY
          echo "- 🌿 **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🔢 **Release Index:** \`${{ inputs.release_index }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🧰 **Base Image:** \`${{ steps.prep.outputs.base_image }}\`" >> $GITHUB_STEP_SUMMARY
          # Include platform info (amd64 or arm64) to clearly indicate architecture
          echo "- 🖥️ **Platform:** \`${{ steps.prep.outputs.platform }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📦 Published Images" >> $GITHUB_STEP_SUMMARY
          # Always show the architecture-specific image that was built
          echo "- 🐺 **Architecture Image:** \`${ARCH_SPECIFIC_TAG}\`" >> $GITHUB_STEP_SUMMARY

          # Only show the main tag for AMD64 builds (ARM will be combined in the manifest job)
          if [ "${{ matrix.platform }}" = "linux/amd64" ]; then
            echo "- 🐺 **Main Wolfi Image:** \`${WOLFI_TAG}\`" >> $GITHUB_STEP_SUMMARY
          fi

          # For branch builds (e.g., wolfi branch), show the branch-specific tag as well
          # Only for AMD64 as the ARM version will be combined in the manifest 
          if [ "${{ github.ref_name }}" = "${{ env.WOLFI_BRANCH }}" ] && [ "${{ matrix.platform }}" = "linux/amd64" ]; then
            BRANCH_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.WOLFI_BRANCH }}-wolfi"
            echo "- 🎯 **Branch Image:** \`${BRANCH_TAG}\`" >> $GITHUB_STEP_SUMMARY
          fi

          # Add handy pull commands section for users
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Pull Commands" >> $GITHUB_STEP_SUMMARY
          echo "```bash" >> $GITHUB_STEP_SUMMARY
          # Always show how to pull the arch-specific image
          echo "# Pull architecture-specific image:" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${ARCH_SPECIFIC_TAG}" >> $GITHUB_STEP_SUMMARY

          # For AMD64, also show how to pull the main image
          if [ "${{ matrix.platform }}" = "linux/amd64" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "# Pull main Wolfi image:" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${WOLFI_TAG}" >> $GITHUB_STEP_SUMMARY
          fi

          # For branch builds, show how to pull the branch image (AMD64 only)
          if [ "${{ github.ref_name }}" = "${{ env.WOLFI_BRANCH }}" ] && [ "${{ matrix.platform }}" = "linux/amd64" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "# Pull branch-specific image:" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.WOLFI_BRANCH }}-wolfi" >> $GITHUB_STEP_SUMMARY
          fi
          echo "```" >> $GITHUB_STEP_SUMMARY

  # Create a multi-arch manifest after building individual architectures
  manifest:
    name: Create Multi-arch Manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Docker Setup
        uses: docker/setup-buildx-action@v3

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and Push Multi-arch Manifest
        run: |
          # This step creates Docker manifest lists that combine AMD64 and ARM64 images
          # Manifests allow Docker to automatically pull the right architecture on different systems

          # Setup tag variables
          BASE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ inputs.release_index }}"
          WOLFI_TAG="${BASE_TAG}-wolfi"
          AMD_TAG="${WOLFI_TAG}-amd"  # The AMD64 specific image tag
          ARM_TAG="${WOLFI_TAG}-arm"  # The ARM64 specific image tag
          
          echo "Creating multi-arch manifest for ${WOLFI_TAG}..."
          
          # Debug the manifest structure first to understand it
          echo "Inspecting AMD64 image manifest structure..."
          docker manifest inspect ${AMD_TAG} > /tmp/amd_manifest.json
          cat /tmp/amd_manifest.json
          
          # Extract the specific digest for each architecture from the manifest lists
          echo "Extracting AMD64 specific digest..."
          AMD_DIGEST=$(jq -r '.manifests[] | select(.platform.architecture == "amd64") | .digest' /tmp/amd_manifest.json)
          if [ -z "$AMD_DIGEST" ]; then
            echo "Could not find AMD64 digest, trying alternative format..."
            # Try alternative format where manifests might be top-level (not in an array)
            AMD_DIGEST=$(jq -r 'if .mediaType | contains("index") then .manifests[] | select(.platform.architecture == "amd64") | .digest else .config.digest end' /tmp/amd_manifest.json)
          fi
          
          # If we still don't have a digest, create a specific pull for debugging
          if [ -z "$AMD_DIGEST" ]; then
            echo "Pulling image directly to inspect digest..."
            docker pull --platform linux/amd64 ${AMD_TAG}
            AMD_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${AMD_TAG} | cut -d '@' -f 2)
          fi
          
          echo "AMD64 digest: ${AMD_DIGEST}"
          AMD_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}@${AMD_DIGEST}"
          
          echo "Inspecting ARM64 image manifest structure..."
          docker manifest inspect ${ARM_TAG} > /tmp/arm_manifest.json
          cat /tmp/arm_manifest.json
          
          echo "Extracting ARM64 specific digest..."
          ARM_DIGEST=$(jq -r '.manifests[] | select(.platform.architecture == "arm64") | .digest' /tmp/arm_manifest.json)
          if [ -z "$ARM_DIGEST" ]; then
            echo "Could not find ARM64 digest, trying alternative format..."
            # Try alternative format
            ARM_DIGEST=$(jq -r 'if .mediaType | contains("index") then .manifests[] | select(.platform.architecture == "arm64") | .digest else .config.digest end' /tmp/arm_manifest.json)
          fi
          
          # If we still don't have a digest, create a specific pull for debugging
          if [ -z "$ARM_DIGEST" ]; then
            echo "Pulling image directly to inspect digest..."
            docker pull --platform linux/arm64 ${ARM_TAG}
            ARM_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${ARM_TAG} | cut -d '@' -f 2)
          fi
          
          echo "ARM64 digest: ${ARM_DIGEST}"
          ARM_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}@${ARM_DIGEST}"
          
          # Check that we have both digests
          if [ -z "$AMD_DIGEST" ] || [ -z "$ARM_DIGEST" ]; then
            echo "❌ Could not extract required digests. Exiting."
            exit 1
          fi
          
          # Remove any existing manifest with this name to ensure a clean start
          docker manifest rm ${WOLFI_TAG} 2>/dev/null || true
          
          # Create a manifest list using the specific digests
          echo "Creating manifest for ${WOLFI_TAG} with:"
          echo "  AMD64: ${AMD_IMAGE}"
          echo "  ARM64: ${ARM_IMAGE}"
          
          docker manifest create ${WOLFI_TAG} ${AMD_IMAGE} ${ARM_IMAGE}
          
          # Push the manifest list to Docker Hub with purge option
          docker manifest push --purge ${WOLFI_TAG}
          
          echo "✅ Successfully created and pushed multi-arch manifest: ${WOLFI_TAG}"

          # For branch builds (e.g., wolfi branch), create a branch-specific manifest too
          if [ "${{ github.ref_name }}" = "${{ env.WOLFI_BRANCH }}" ]; then
            BRANCH_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.WOLFI_BRANCH }}-wolfi"
            BRANCH_AMD_TAG="${BRANCH_TAG}-amd"
            BRANCH_ARM_TAG="${BRANCH_TAG}-arm"
            
            echo "Creating multi-arch manifest for ${BRANCH_TAG}..."
            
            # Extract digests for branch images using the same approach
            echo "Inspecting branch AMD64 image manifest structure..."
            docker manifest inspect ${BRANCH_AMD_TAG} > /tmp/branch_amd_manifest.json
            cat /tmp/branch_amd_manifest.json
            
            echo "Extracting branch AMD64 specific digest..."
            BRANCH_AMD_DIGEST=$(jq -r '.manifests[] | select(.platform.architecture == "amd64") | .digest' /tmp/branch_amd_manifest.json)
            if [ -z "$BRANCH_AMD_DIGEST" ]; then
              echo "Could not find branch AMD64 digest, trying alternative format..."
              BRANCH_AMD_DIGEST=$(jq -r 'if .mediaType | contains("index") then .manifests[] | select(.platform.architecture == "amd64") | .digest else .config.digest end' /tmp/branch_amd_manifest.json)
            fi
            
            if [ -z "$BRANCH_AMD_DIGEST" ]; then
              echo "Pulling branch image directly to inspect digest..."
              docker pull --platform linux/amd64 ${BRANCH_AMD_TAG}
              BRANCH_AMD_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${BRANCH_AMD_TAG} | cut -d '@' -f 2)
            fi
            
            echo "Branch AMD64 digest: ${BRANCH_AMD_DIGEST}"
            BRANCH_AMD_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}@${BRANCH_AMD_DIGEST}"
            
            echo "Inspecting branch ARM64 image manifest structure..."
            docker manifest inspect ${BRANCH_ARM_TAG} > /tmp/branch_arm_manifest.json
            cat /tmp/branch_arm_manifest.json
            
            echo "Extracting branch ARM64 specific digest..."
            BRANCH_ARM_DIGEST=$(jq -r '.manifests[] | select(.platform.architecture == "arm64") | .digest' /tmp/branch_arm_manifest.json)
            if [ -z "$BRANCH_ARM_DIGEST" ]; then
              echo "Could not find branch ARM64 digest, trying alternative format..."
              BRANCH_ARM_DIGEST=$(jq -r 'if .mediaType | contains("index") then .manifests[] | select(.platform.architecture == "arm64") | .digest else .config.digest end' /tmp/branch_arm_manifest.json)
            fi
            
            if [ -z "$BRANCH_ARM_DIGEST" ]; then
              echo "Pulling branch image directly to inspect digest..."
              docker pull --platform linux/arm64 ${BRANCH_ARM_TAG}
              BRANCH_ARM_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${BRANCH_ARM_TAG} | cut -d '@' -f 2)
            fi
            
            echo "Branch ARM64 digest: ${BRANCH_ARM_DIGEST}"
            BRANCH_ARM_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}@${BRANCH_ARM_DIGEST}"
            
            # Check that we have both branch digests
            if [ -z "$BRANCH_AMD_DIGEST" ] || [ -z "$BRANCH_ARM_DIGEST" ]; then
              echo "❌ Could not extract required branch digests. Skipping branch manifest."
            else
              # Remove any existing manifest with this name
              docker manifest rm ${BRANCH_TAG} 2>/dev/null || true
              
              # Create manifest list using the specific digests
              echo "Creating branch manifest for ${BRANCH_TAG} with:"
              echo "  AMD64: ${BRANCH_AMD_IMAGE}"
              echo "  ARM64: ${BRANCH_ARM_IMAGE}"
              
              docker manifest create ${BRANCH_TAG} ${BRANCH_AMD_IMAGE} ${BRANCH_ARM_IMAGE}
              
              # Push the branch-specific manifest to Docker Hub with purge option
              docker manifest push --purge ${BRANCH_TAG}
              
              echo "✅ Successfully created and pushed branch multi-arch manifest: ${BRANCH_TAG}"
            fi
          fi

      - name: Generate Summary
        run: |
          # This step creates a summary for the multi-architecture manifest job
          # The manifest combines AMD64 and ARM64 builds into a single, architecture-aware image

          # Setup tag variables
          BASE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ inputs.release_index }}"
          WOLFI_TAG="${BASE_TAG}-wolfi"

          # Create the manifest summary header
          echo "## 🚀 Multi-architecture Manifest Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # List the main multi-arch image that was created
          echo "### 📦 Published Manifests" >> $GITHUB_STEP_SUMMARY
          echo "- 🐺 **Multi-arch Image:** \`${WOLFI_TAG}\`" >> $GITHUB_STEP_SUMMARY

          # If this is a branch build (e.g., wolfi branch), show the branch-specific manifest too
          if [ "${{ github.ref_name }}" = "${{ env.WOLFI_BRANCH }}" ]; then
            BRANCH_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.WOLFI_BRANCH }}-wolfi"
            echo "- 🎯 **Branch Multi-arch Image:** \`${BRANCH_TAG}\`" >> $GITHUB_STEP_SUMMARY
          fi

          # Clearly show which architectures are supported by this manifest
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏛️ Architecture Support" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ linux/arm64" >> $GITHUB_STEP_SUMMARY

          # Add useful Docker pull commands for the multi-arch images
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Pull Commands" >> $GITHUB_STEP_SUMMARY
          echo "```bash" >> $GITHUB_STEP_SUMMARY
          # The beauty of multi-arch manifests is that Docker automatically selects the right architecture
          echo "# Pull multi-arch image (will select appropriate architecture automatically):" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${WOLFI_TAG}" >> $GITHUB_STEP_SUMMARY

          # For branch builds, show how to pull the branch-specific multi-arch image
          if [ "${{ github.ref_name }}" = "${{ env.WOLFI_BRANCH }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "# Pull branch multi-arch image:" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.WOLFI_BRANCH }}-wolfi" >> $GITHUB_STEP_SUMMARY
          fi
          echo "```" >> $GITHUB_STEP_SUMMARY
