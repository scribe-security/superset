name: Scribe Docker Release

on:
  workflow_dispatch:
    inputs:
      release_index:
        required: true
      build_type:
        description: 'Image to build'
        required: true
        default: 'base'
        type: choice
        options:
          - base
          - wolfi
          - both

jobs:
  docker-build:
    name: docker-build
    if: ${{ inputs.build_type == 'base' || inputs.build_type == 'both' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_preset: ["py311"]
        platform: ["linux/amd64", "linux/arm64"]
      fail-fast: false
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        shell: bash
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          pip install click
          ./scripts/build_docker.py \
            ${{ matrix.build_preset }} \
            "release" \
            --build_context_ref "${{ github.ref_name }}-${{ inputs.release_index }}" \
            --platform ${{ matrix.platform }}
          
      - name: Print version info
        if: ${{ matrix.platform == 'linux/amd64' }}  # Only print once
        run: |
          echo "::notice::Successfully built and pushed standard Superset image:"
          echo "::notice::Tag: scribesecurity/superset:${{ github.ref_name }}-${{ inputs.release_index }}-py311"
          echo "::notice::Branch: ${{ github.ref_name }}"
          echo "::notice::Release Index: ${{ inputs.release_index }}"
          
  wolfi-build:
    name: wolfi-build
    needs: [docker-build]
    if: ${{ inputs.build_type == 'both' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: ["linux/amd64", "linux/arm64"]
      fail-fast: false
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Wolfi-based image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./wolfi/Dockerfile.wolfie
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            scribesecurity/superset:${{ github.ref_name }}-${{ inputs.release_index }}-wolfi-${{ matrix.platform == 'linux/amd64' && 'amd' || 'arm' }}
            ${{ github.ref_name == '4.1.2-to-wolfie' && format('scribesecurity/superset:4.1.2-to-wolfie-wolfi-{0}', matrix.platform == 'linux/amd64' && 'amd' || 'arm') || '' }}
          build-args: |
            BASE_IMAGE=scribesecurity/superset:${{ github.ref_name }}-${{ inputs.release_index }}-py311
            
      - name: Print version info
        if: ${{ matrix.platform == 'linux/amd64' }}  # Only print once
        run: |
          echo "::notice::Successfully built and pushed Wolfi-based image:"
          echo "::notice::Tag: scribesecurity/superset:${{ github.ref_name }}-${{ inputs.release_index }}-wolfi-amd"
          echo "::notice::Branch: ${{ github.ref_name }}"
          echo "::notice::Release Index: ${{ inputs.release_index }}"

  wolfi-build-standalone:
    name: wolfi-build-standalone
    if: ${{ inputs.build_type == 'wolfi' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: ["linux/amd64", "linux/arm64"]
      fail-fast: false
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build base image locally first
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          target: lean
          build-args: |
            PY_VER=3.11-slim-bookworm
          tags: |
            scribesecurity/superset:${{ github.ref_name }}-${{ inputs.release_index }}-py311-local

      - name: Build and push Wolfi-based image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./wolfi/Dockerfile.wolfie
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            scribesecurity/superset:${{ github.ref_name }}-${{ inputs.release_index }}-wolfi-${{ matrix.platform == 'linux/amd64' && 'amd' || 'arm' }}
            ${{ github.ref_name == '4.1.2-to-wolfie' && format('scribesecurity/superset:4.1.2-to-wolfie-wolfi-{0}', matrix.platform == 'linux/amd64' && 'amd' || 'arm') || '' }}
          build-args: |
            BASE_IMAGE=scribesecurity/superset:${{ github.ref_name }}-${{ inputs.release_index }}-py311-local
            
      - name: Print version info
        if: ${{ matrix.platform == 'linux/amd64' }}  # Only print once
        run: |
          echo "::notice::Successfully built and pushed Wolfi-based image (standalone mode):"
          echo "::notice::Tag: scribesecurity/superset:${{ github.ref_name }}-${{ inputs.release_index }}-wolfi-amd"
          echo "::notice::Branch: ${{ github.ref_name }}"
          echo "::notice::Release Index: ${{ inputs.release_index }}"
